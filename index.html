<!DOCTYPE html>
<html>
    <head>
        <title>Simon Dice!</title>
        <link rel="stylesheet" href="normalize.css">
        <link rel="stylesheet" href="styles.css">
        
    </head>
    <body>
        <section id="tablaPuntacion">
            <div>Puntuacion</div>
            <div class="puntuacion">-</div>
            <div>Nivel</div>
            <div class="nivel">-</div>
        </section>
        <aside id="rankings">
            <div class="rank">Nombre Puntos Fecha</div>
            <div class="col-nombre">test</div>
            <div class="col-puntos">test</div>
            <!--<div class="col-nivel">test</div> -->
            <div class="col-tiempo">test</div>
                
        </aside>
        <main>
        <div id="juego">
            <div class="celda" pos="1"></div>
            <div class="celda" pos="2"></div>
            <div class="celda" pos="3"></div>
            <div class="celda" pos="4"></div>
        </div>
        <div id="botonMensaje">
            <section id="preguntarNombre">
            <input type="text" id="inputNombre">
            </section>
            <div id= texto>texto</div>
            <div id="mensaje"></div>
            <button id="comienzo">Empezar</button>
        </div>
        </main>
       <script defer src="puntuacion.js"></script>
       <script defer src="ranking.js"></script> 
        <script async src="script.js"></script>
    </body>
</html>
